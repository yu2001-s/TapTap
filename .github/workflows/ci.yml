name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build app with explicit ad-hoc signing
        env:
          SIGN_IDENTITY: '-'
        run: Scripts/build-app.sh
      - name: Verify app and localization resources
        run: |
          codesign --verify --deep --strict --verbose=2 build/TapTap.app
          plutil -lint build/TapTap.app/Contents/Info.plist
          for language in en zh-Hans zh-Hant; do
            test -f "build/TapTap.app/Contents/Resources/TapTap_TapTapApp.bundle/$language.lproj/Localizable.strings"
          done
      - name: Package development artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/TapTap.app build/TapTap-ci.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TapTap-macOS-development
          path: build/TapTap-ci.zip
          if-no-files-found: error
          retention-days: 7
